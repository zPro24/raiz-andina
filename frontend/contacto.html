<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raíz Andina - Contacto</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">🌿 Raíz Andina</a>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="nosotros.html">Quiénes somos</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="contacto.html" class="active">Contacto</a></li>
        <li><a href="login.html" class="btn-login-nav">Iniciar sesión</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="container-page">
      <h2>Contacto</h2>
      <form class="form-container">
        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" required placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
          <label>Mensaje</label>
          <textarea rows="4" required placeholder="Escribe tu mensaje..."></textarea>
        </div>
        <button type="submit" class="btn-primary">Enviar mensaje</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Raíz Andina. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
