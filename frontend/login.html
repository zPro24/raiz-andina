<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raíz Andina - Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">🌿 Raíz Andina</a>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="nosotros.html">Quiénes somos</a></li>
        <li><a href="productos.html">Productos</a></li>

        <li><a href="login.html" class="btn-login-nav">Iniciar sesión</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="container-page">
      <h2>Iniciar sesión</h2>
      <form id="form-login" class="form-container">
        <div class="form-group">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" required placeholder="usuario@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="pepitoperez123">
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Raíz Andina. Todos los derechos reservados.</p>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
